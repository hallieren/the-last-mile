# Companion template from The Last Mile. Modify freely and use at work, no attribution needed.
# Machine-readable handoff checklist (Template 22). Flat key: value; the standard library has no YAML parser, so the validation script hand-parses it. Do not add nesting.
# Sample data comes from the book's Anchor & Helm case (week 25 snapshot: the exception capability test failed and has a rework attached).

# ---- Four owners (22.1.1, one real name per line; an empty name is an alarm) ----
system_owner: Kevin Doyle
maintenance_owner: claims-ops IT engineer A
eval_guardian: Linda Marsh
ai_dependency_owner: Linda Marsh + Kevin Doyle (the younger one runs the replay)

# ---- Three AI handoff items (22.1.2, missing from the traditional IT handoff vocabulary, easiest to miss) ----
ai_eval_update: Linda Marsh
ai_model_revalidation: Linda Marsh + Kevin Doyle
ai_trace_review: Linda Marsh

# ---- Five self-sufficiency capability state machine (22.2): pending / failed / passed
#    A failed capability must have both cap_<capability>_rework and cap_<capability>_retest attached (what it needs is a drill, not a document)
cap_run_status: passed
cap_config_status: passed
cap_exception_status: failed
cap_exception_rework: drew the escalation tree together + two injected drills
cap_exception_retest: week 27
cap_evolve_status: pending
cap_teach_status: pending

# ---- Response window (22.3) ----
window_end: 2026-10-30
window_scope: only P1 incidents and exceptions the escalation tree's end point could not catch
