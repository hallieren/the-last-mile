<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 360" font-family="Inter,-apple-system,sans-serif">
  <style>
    .surface{fill:#FAFAF8}.tp{fill:#0A0A0A}.ts{fill:#737373}
    .s1{fill:#002FA7;fill-opacity:.25}.s2{fill:#002FA7;fill-opacity:.40}
    .s3{fill:#002FA7;fill-opacity:.55}.s4{fill:#002FA7;fill-opacity:.75}
    .s5{fill:#002FA7}.onfill{fill:#ffffff}
    @media (prefers-color-scheme: dark){
      .surface{fill:#1C1C1A}.tp{fill:#FAFAF8}.ts{fill:#A8A8A6}
      .s1{fill:#7A96E8;fill-opacity:.30}.s2{fill:#7A96E8;fill-opacity:.45}
      .s3{fill:#7A96E8;fill-opacity:.60}.s4{fill:#7A96E8;fill-opacity:.78}
      .s5{fill:#7A96E8}
    }
  </style>
  <rect class="surface" x="0" y="0" width="660" height="360"/>
  <text class="tp" x="24" y="36" font-size="17" font-weight="600">Outcome Ladder: The Five Rungs of Delivery</text>
  <text class="ts" x="24" y="58" font-size="12">The deliverer's unit of value is the production outcome, not the demo (Chapter 1)</text>
  <rect class="s1" x="24"  y="260" width="118" height="60"  rx="4"/>
  <rect class="s2" x="148" y="215" width="118" height="105" rx="4"/>
  <rect class="s3" x="272" y="170" width="118" height="150" rx="4"/>
  <rect class="s4" x="396" y="125" width="118" height="195" rx="4"/>
  <rect class="s5" x="520" y="80"  width="118" height="240" rx="4"/>
  <g font-size="13.5" font-weight="600" text-anchor="middle">
    <text class="tp" x="83"  y="248">L0 demo</text>
    <text class="tp" x="207" y="203">L1 pilot</text>
    <text class="tp" x="331" y="158">L2 production</text>
    <text class="tp" x="455" y="113">L3 adopted</text>
    <text class="tp" x="579" y="68">L4 self-sufficient</text>
  </g>
  <g font-size="11" text-anchor="middle">
    <text class="tp" x="83"  y="294">Demo worked</text>
    <text class="tp" x="207" y="272">Real users active</text>
    <text class="tp" x="331" y="230">In production</text>
    <text class="onfill" x="455" y="186">Daily actions change</text>
    <text class="onfill" x="579" y="142">Business runs it</text>
  </g>
  <g font-size="11">
    <text class="ts" x="83" y="342" text-anchor="middle">Applause lives here</text>
    <text class="ts" x="517" y="342" text-anchor="middle">Deliverer's credit settles only at L3 / L4</text>
  </g>
</svg>
