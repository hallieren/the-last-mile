<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="Inter,-apple-system,sans-serif">
  <style>
    .surface{fill:#FAFAF8}.tp{fill:#0A0A0A}.ts{fill:#737373}
    .s1{fill:#002FA7;fill-opacity:.20}.s2{fill:#002FA7;fill-opacity:.32}
    .s3{fill:#002FA7;fill-opacity:.45}.s4{fill:#002FA7;fill-opacity:.58}
    .s5{fill:#002FA7;fill-opacity:.72}.s6{fill:#002FA7;fill-opacity:.86}
    .s7{fill:#002FA7}.onfill{fill:#ffffff}
    @media (prefers-color-scheme: dark){
      .surface{fill:#1C1C1A}.tp{fill:#FAFAF8}.ts{fill:#A8A8A6}
      .s1{fill:#7A96E8;fill-opacity:.26}.s2{fill:#7A96E8;fill-opacity:.38}
      .s3{fill:#7A96E8;fill-opacity:.50}.s4{fill:#7A96E8;fill-opacity:.62}
      .s5{fill:#7A96E8;fill-opacity:.75}.s6{fill:#7A96E8;fill-opacity:.88}
      .s7{fill:#7A96E8}
    }
  </style>
  <rect class="surface" x="0" y="0" width="720" height="400"/>
  <text class="tp" x="24" y="36" font-size="17" font-weight="600">Data Fitness Ladder: A Seven-Rung Verdict</text>
  <text class="ts" x="24" y="58" font-size="12">Rung by rung, no skipping. Stop at the first rung with no evidence. That is where the source really stands.</text>
  <rect class="s1" x="24"  y="300" width="92" height="60"  rx="4"/>
  <rect class="s2" x="120" y="270" width="92" height="90"  rx="4"/>
  <rect class="s3" x="216" y="240" width="92" height="120" rx="4"/>
  <rect class="s4" x="312" y="210" width="92" height="150" rx="4"/>
  <rect class="s5" x="408" y="180" width="92" height="180" rx="4"/>
  <rect class="s6" x="504" y="150" width="92" height="210" rx="4"/>
  <rect class="s7" x="600" y="120" width="92" height="240" rx="4"/>
  <g font-size="12" font-weight="600" text-anchor="middle">
    <text class="tp" x="70"  y="288">exists</text>
    <text class="tp" x="166" y="258">accessible</text>
    <text class="tp" x="262" y="228">interpretable</text>
    <text class="tp" x="358" y="198">timely</text>
    <text class="tp" x="454" y="168">traceable</text>
    <text class="tp" x="550" y="138">validated</text>
    <text class="tp" x="646" y="108">actionable</text>
  </g>
  <g font-size="10.5" text-anchor="middle">
    <text class="tp" x="70"  y="334">Recorded anywhere?</text>
    <text class="tp" x="166" y="318">Readable by you?</text>
    <text class="tp" x="262" y="303">One meaning?</text>
    <text class="tp" x="358" y="288">Keeps up?</text>
    <text class="onfill" x="454" y="273">Where from?</text>
    <text class="onfill" x="550" y="258">Reconciled?</text>
    <text class="onfill" x="646" y="243">Drives action?</text>
  </g>
  <g font-size="11">
    <text class="ts" x="118" y="384" text-anchor="middle">Verbal assurances and demos stop here</text>
    <text class="ts" x="646" y="384" text-anchor="middle">The queue's entry ticket</text>
  </g>
</svg>
